<!DOCTYPE html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width,initial-scale=1.0">
		<meta name="theme-color" content="#0F131A">
		<meta name="description" content="">
		<link rel="icon" href="./favicon.ico">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Ubuntu+Sans:wght@400;600;800&display=swap" rel="stylesheet">
		<title>Gustavo Carvalho</title>
		<script>
			// Aplica o tema salvo antes da primeira pintura (cores completas em src/styles/_tokens.scss)
			try {
				var t = localStorage.getItem('theme');
				if (['midnight', 'dracula', 'nord', 'forest', 'red'].indexOf(t) !== -1) document.documentElement.dataset.theme = t;
			} catch (e) {}
		</script>
		<style>
			:root, [data-theme='midnight'] { --boot-bg: #0F131A; --boot-line: #27354E; --boot-accent: #5779B6; }
			[data-theme='dracula'] { --boot-bg: #282A36; --boot-line: #44475A; --boot-accent: #BD93F9; }
			[data-theme='nord'] { --boot-bg: #2E3440; --boot-line: #434C5E; --boot-accent: #88C0D0; }
			[data-theme='forest'] { --boot-bg: #1B1F23; --boot-line: #145A3A; --boot-accent: #CBBFA6; }
			[data-theme='red'] { --boot-bg: #0B0605; --boot-line: #4A0000; --boot-accent: #E03A2F; }
			html { background: var(--boot-bg); }
			body { margin: 0; }
			.boot-loader {
				position: fixed;
				inset: 0;
				display: flex;
				align-items: center;
				justify-content: center;
			}
			.boot-loader span {
				width: 40px;
				height: 40px;
				border: 2px solid var(--boot-line);
				border-top-color: var(--boot-accent);
				border-radius: 50%;
				animation: boot-spin 0.8s linear infinite;
			}
			@keyframes boot-spin { to { transform: rotate(360deg); } }
			@media (prefers-reduced-motion: reduce) {
				.boot-loader span { animation-duration: 2.4s; }
			}
		</style>
	</head>
	<body>
		<script>
			if (window.location.protocol === 'http:' && window.location.hostname !== 'localhost') {
				window.location.href = window.location.href.replace('http:', 'https:');
			}
		</script>
		<noscript>
			<strong>Este site precisa de JavaScript. Contato: gustavo1pix@gmail.com</strong>
		</noscript>
		<div id="app">
			<div class="boot-loader" aria-hidden="true"><span></span></div>
		</div>
		<script type="module" src="/src/main.js"></script>
	</body>
</html>
